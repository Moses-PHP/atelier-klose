<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Správa webu – Ateliér Klose</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- login -->
<section id="login" class="login" hidden>
  <div class="login-box">
    <div class="logo" data-logo></div>
    <h1>Správa webu</h1>
    <form id="loginForm" autocomplete="on">
      <label for="pass">Heslo</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Přihlásit</button>
      <p class="msg" id="loginMsg" role="alert"></p>
    </form>
  </div>
</section>

<!-- app -->
<section id="app" class="app" hidden>
  <header class="bar">
    <div class="brand"><span class="logo small" data-logo></span><span>Správa webu</span></div>
    <nav class="actions">
      <a class="btn ghost" href="../" target="_blank" rel="noopener">Zobrazit web ↗</a>
      <button class="btn ghost" id="discard" disabled>Zahodit změny</button>
      <button class="btn primary" id="publish" disabled>Zveřejnit změny</button>
      <button class="btn link" id="logout">Odhlásit</button>
    </nav>
  </header>
  <main class="main">
    <aside class="houses">
      <div class="houses-head">
        <h2>Domy</h2>
        <button class="btn" id="addHouse">+ Přidat dům</button>
      </div>
      <p class="hint">Pořadí změníte přetažením. Nahoře = první na webu.</p>
      <ul id="houseList" class="house-list"></ul>
    </aside>
    <section class="detail" id="detail"></section>
  </main>
</section>

<section id="boot" class="boot"><p id="bootMsg">Načítám…</p></section>

<div id="modal" class="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status"></div>

<script src="vendor/Sortable.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
